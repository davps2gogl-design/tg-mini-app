<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <!-- Подключение Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1 id="user-name">Привіт!</h1>
    <p>Це твоє перше Mini App додаток на iOS</p>
    <button id="send-btn">Надіслати дані боту</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортаємо веб-додаток на весь екран

        // Відображаємо ім'я користувача з Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = `Привіт, ${tg.initDataUnsafe.user.first_name}!`;
        }

        // Кнопка для передачі даних назад у чат з ботом
        document.getElementById('send-btn').addEventListener('click', () => {
            tg.sendData(JSON.stringify({ message: "Кнопка була натиснута!" }));
        });
    </script>
</body>
</html>
